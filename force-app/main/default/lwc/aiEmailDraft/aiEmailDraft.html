<template>
    <lightning-quick-action-panel header="AI Email Draft">
        <template lwc:if={isLoading}>
            <div class="loading">
                <div class="spin"></div>
                <div class="big">Writing your draft...</div>
                <div>This takes a few seconds.</div>
            </div>
        </template>
        <template lwc:elseif={error}>
            <div class="error"><b>Sorry, this did not work.</b><br>{error}</div>
        </template>
        <template lwc:else>
            <div class="hero">
                <div class="hero-icon">&#9993;</div>
                <div>
                    <div class="hero-title">Follow-up email draft</div>
                    <div class="hero-sub">{title}</div>
                </div>
                <div class="badge">Nothing has been sent</div>
            </div>

            <div class="card">
                <div class="meta">
                    <div class="k">To</div><div class="v">{email}</div>
                    <div class="k">Subject</div><div class="v">{subject}</div>
                </div>
                <div class="paper">{body}</div>
            </div>
            <p class="note">Written by AI as a starting point. Click <b>Copy email</b>, paste it into your own email, edit it as you like and send it yourself.</p>
        </template>
        <div slot="footer">
            <lightning-button variant="neutral" label="Close" onclick={handleClose}></lightning-button>
            <lightning-button class="slds-m-left_x-small" variant="brand" icon-name="utility:copy" label="Copy email" disabled={isLoading} onclick={handleCopy}></lightning-button>
            <lightning-button class="slds-m-left_x-small" variant="neutral" icon-name="utility:refresh" label="Regenerate" disabled={isLoading} onclick={handleRegenerate}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
